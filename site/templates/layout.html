<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<script>
  // Set the theme before the page paints: light, unless the visitor switched to dark with the nav button.
  (() => {
    let theme;
    try { theme = localStorage.getItem("theme"); } catch {}
    if (theme !== "dark") theme = "light";
    document.documentElement.dataset.theme = theme;
    document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#000000" : "#ffffff";
  })();
</script>

<script>
  // Light/dark switch. The site is light until a visitor turns dark mode on here; the choice is remembered.
  (() => {
    const root = document.documentElement, toggle = document.querySelector(".theme-toggle");
    function apply(theme) {
      // Change every color in the same frame (style.css turns transitions off under .theme-switching).
      root.classList.add("theme-switching");
      root.dataset.theme = theme;
      toggle.setAttribute("aria-pressed", theme === "dark");
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#000000" : "#ffffff";
      getComputedStyle(root).color; // apply the new colors before transitions come back
      root.classList.remove("theme-switching");
      dispatchEvent(new CustomEvent("themechange", { detail: theme }));
    }
    toggle.addEventListener("click", () => {
      const theme = root.dataset.theme === "dark" ? "light" : "dark";
      try { localStorage.setItem("theme", theme); } catch {}
      // A short whole-page cross-fade where supported; otherwise (or with Reduce Motion) an instant switch.
      if (document.startViewTransition && !document.hidden && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const transition = document.startViewTransition(() => apply(theme));
        transition.ready.catch(() => {}); // a skipped fade still switches the theme
        transition.finished.catch(() => {});
      } else apply(theme);
    });
    toggle.setAttribute("aria-pressed", root.dataset.theme === "dark");
  })();
</script>
